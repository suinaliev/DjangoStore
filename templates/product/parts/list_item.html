{% load wishlist_tags %}
<div class="column is-4 product-list-item">
    <div class="card">
        <div class="card-image">
            <figure class="image is-square">
                <img src="{{ product.get_thumbnail }}" alt="{{product.title}}" class="product-image">
            </figure>
            {% if product.brand %}
            <div class="brand-badge">
                <span class="tag is-info is-light">{{ product.brand.name }}</span>
            </div>
            {% endif %}
            <button class="wishlist-button toggle-wishlist" data-product-id="{{ product.id }}">
                {% if request.user.is_authenticated %}
                    {% with user_wishlist=request.user.wishlist_set.first %}
                        <span class="icon {% if product in user_wishlist.products.all %}has-text-danger{% endif %}">
                            <i class="{% if product in user_wishlist.products.all %}fas{% else %}far{% endif %} fa-heart"></i>
                        </span>
                    {% endwith %}
                {% else %}
                    {% with session_wishlist=request.session.session_key|wishlist_by_session %}
                        <span class="icon {% if session_wishlist and product in session_wishlist.products.all %}has-text-danger{% endif %}">
                            <i class="{% if session_wishlist and product in session_wishlist.products.all %}fas{% else %}far{% endif %} fa-heart"></i>
                        </span>
                    {% endwith %}
                {% endif %}
            </button>
        </div>
        
        <div class="card-content">
            <div class="content">
                <div class="product-info">
                    <h3 class="title is-5 mb-2 product-title">{{product.title}}</h3>
                    <p class="price has-text-weight-bold has-text-primary is-size-4 mb-4">{{product.price}} сом</p>
                </div>
                
                <div class="product-actions">
                    <a href="{% url 'product:product' product.category.slug product.slug %}" class="button is-primary is-fullwidth mb-2">
                        <span class="icon">
                            <i class="fas fa-music"></i>
                        </span>
                        <span>Подробнее</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.product-list-item .card {
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.product-list-item .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.product-list-item .card-image {
    position: relative;
    background: #f5f5f5;
}

.product-image {
    object-fit: contain !important;
    padding: 1rem;
    background: white;
    transition: transform 0.3s ease;
    width: 100%;
    height: 100%;
}

.product-list-item .card:hover .product-image {
    transform: scale(1.05);
}

.brand-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1;
}

.wishlist-button {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.wishlist-button:hover {
    transform: scale(1.1);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.product-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    height: 2.4em;
    line-height: 1.2;
}

.price {
    font-family: 'Roboto', sans-serif;
    letter-spacing: -0.5px;
}

.product-actions {
    margin-top: auto;
}

/* Hover effects */
.product-list-item .button {
    transition: all 0.3s ease;
}

.product-list-item .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Responsive adjustments */
@media screen and (max-width: 768px) {
    .product-list-item {
        padding: 0.5rem;
    }
    
    .product-title {
        font-size: 1rem;
    }
    
    .price {
        font-size: 1.25rem !important;
    }
}
</style>
