{% extends 'core/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="columns is-centered">
    <div class="column is-half">
        <div class="box">
            <h1 class="title has-text-centered">Вход в систему</h1>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="field">
                    <label class="label">Имя пользователя</label>
                    <div class="control">
                        <input class="input" type="text" name="username" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Пароль</label>
                    <div class="control">
                        <input class="input" type="password" name="password" required>
                    </div>
                </div>

                {% if form.errors %}
                    <div class="notification is-danger">
                        Неправильное имя пользователя или пароль.
                    </div>
                {% endif %}

                <div class="field">
                    <div class="control">
                        <button class="button is-primary is-fullwidth">Войти</button>
                    </div>
                </div>
            </form>

            <div class="has-text-centered mt-4">
                <p>Нет аккаунта? <a href="{% url 'core:register' %}">Зарегистрируйтесь</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
